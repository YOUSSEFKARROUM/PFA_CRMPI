[flake8]
max-line-length = 120
exclude = .git,__pycache__,app.db,.venv,venv,.venv*
per-file-ignores =
    src/ui_components.py:E501
    scripts/init_db.py:E402
    tests/test_app_flow.py:E402
    tests/test_auth.py:E402
    tests/test_database_pdf.py:E402
    tests/test_profiles.py:E402
    tests/test_questionnaire.py:E402
    tests/test_scoring.py:E402
